nelmio_api_doc:
    documentation:
        info:
            title: SpaceCamAPI
            description: API de gestion de caméras de surveillance
            version: 1.0.0
        components:
            securitySchemes:
                Session:
                    type: http
                    scheme: bearer
                    description: Session-based authentication
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
